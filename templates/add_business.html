<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <title>Add Business Profile — AgencyOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { background-color: #09090b; font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 sm:p-12 max-w-3xl mx-auto selection:bg-indigo-500 selection:text-white">

  <a href="{{ url_for('customer.businesses') }}" class="text-xs font-mono text-indigo-400 hover:underline flex items-center gap-1.5">
    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
    <span>Return to Businesses</span>
  </a>

  <div class="mt-6 pb-6 border-b border-zinc-800">
    <span class="text-xs font-mono uppercase text-indigo-400 font-bold">Client Onboarding</span>
    <h1 class="text-3xl font-extrabold text-white mt-1">Register Business Profile</h1>
    <p class="text-xs text-zinc-400 mt-1">Provide business context so our specialists and Gemini AI can calibrate website designs and SEO keyword targets.</p>
  </div>

  <form method="POST" action="{{ url_for('customer.add_business') }}" class="mt-8 space-y-6 text-xs">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <!-- 1. Identity & Online Presence -->
    <div class="p-6 rounded-2xl bg-[#121215] border border-zinc-800 space-y-4">
      <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">1. Brand Identity & Presence</h3>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Business / Legal Entity Name *</label>
          <input type="text" name="name" required placeholder="e.g. Bombay Spice Co. Pvt Ltd" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Industry / Business Category *</label>
          <input type="text" name="business_type" required placeholder="e.g. D2C Retail, Restaurant, SaaS, Real Estate" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Operating City & State *</label>
          <input type="text" name="location" required placeholder="e.g. Mumbai, Maharashtra" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Current Website or Google Maps URL</label>
          <input type="url" name="website" placeholder="https://yourbusiness.com" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-zinc-400 font-semibold mb-1.5">Social Profiles (Instagram, LinkedIn, Facebook)</label>
        <input type="text" name="social_links" placeholder="instagram.com/brand, linkedin.com/company/brand" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
      </div>
    </div>

    <!-- 2. Strategic Context & Growth Objectives -->
    <div class="p-6 rounded-2xl bg-[#121215] border border-zinc-800 space-y-4">
      <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">2. Strategy & Target Audience</h3>

      <div>
        <label class="block text-zinc-400 font-semibold mb-1.5">Ideal Target Audience & Geography</label>
        <input type="text" name="target_audience" placeholder="e.g. Young professionals in Bangalore seeking organic food, ages 25-40" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-zinc-400 font-semibold mb-1.5">Primary Growth Objective / Goal</label>
        <select name="goals" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
          <option value="Rank #1 on Google Local Pack & Drive Phone Calls">Rank #1 on Google Local Pack & Drive Customer Calls</option>
          <option value="High-Converting E-Commerce Store with UPI Rails">High-Converting E-Commerce Store with UPI Rails</option>
          <option value="Modern Corporate Website for B2B Client Trust">Modern Corporate Website for B2B Client Trust</option>
          <option value="Complete Brand Overhaul & Lead Generation Engine">Complete Brand Overhaul & Lead Generation Engine</option>
        </select>
      </div>

      <div>
        <label class="block text-zinc-400 font-semibold mb-1.5">Company Description & Offerings</label>
        <textarea name="description" rows="3" placeholder="Briefly describe what your business sells, your USP, and competitor websites you admire..." class="w-full p-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <div>
        <label class="block text-zinc-400 font-semibold mb-1.5">Preferred Monthly / Milestone Budget Tier</label>
        <select name="preferred_budget" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white font-mono focus:outline-none focus:border-indigo-500">
          <option value="₹25,000 – ₹50,000 (Growth Sprint)">₹25,000 – ₹50,000 (Growth Sprint)</option>
          <option value="₹50,000 – ₹1,00,000 (Scale Package)">₹50,000 – ₹1,00,000 (Scale Package)</option>
          <option value="₹1,00,000+ (Full Enterprise Overhaul)">₹1,00,000+ (Full Enterprise Overhaul)</option>
        </select>
      </div>
    </div>

    <button type="submit" class="w-full py-3.5 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-bold text-xs shadow-xl transition cursor-pointer">
      Register Business Context →
    </button>
  </form>

  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
