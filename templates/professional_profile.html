<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <title>Specialist Payout Settings & Profile — AgencyOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body { background-color: #09090b; font-family: 'Plus Jakarta Sans', sans-serif; color: #f4f4f5; }
    .pro-card { background: #121215; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 sm:p-12 max-w-3xl mx-auto selection:bg-indigo-500 selection:text-white space-y-6">

  <!-- Header -->
  <a href="/professional/dashboard" class="text-xs font-mono text-indigo-400 hover:underline flex items-center gap-1.5">
    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
    <span>Return to Specialist Hub</span>
  </a>

  <div class="pb-6 border-b border-zinc-800 flex items-center justify-between">
    <div>
      <span class="text-xs font-mono uppercase text-emerald-400 font-bold">Banking & Payout Rails</span>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-1">Specialist Profile & UPI Setup</h1>
      <p class="text-xs text-zinc-400 mt-1">Configure your verified Indian UPI ID (VPA), Bank IFSC, and professional credentials for automated sprint payouts.</p>
    </div>
    <span class="px-3 py-1 rounded-full text-xs font-mono bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
      Direct IMPS / UPI
    </span>
  </div>

  <!-- Form -->
  <form method="POST" action="/professional/profile" class="space-y-6 text-xs">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <!-- 1. Indian Banking & UPI Payout Details (CRITICAL) -->
    <div class="pro-card p-6 space-y-4">
      <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
        <span>1. Indian Banking & UPI Payout Credentials (INR)</span>
      </h3>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">UPI ID (VPA) * (Google Pay / PhonePe / Paytm)</label>
          <input type="text" name="upi_id" value="{{ profile.upi_id or '' }}" required placeholder="e.g. yourname@okaxis or yourphone@upi" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white font-mono focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">PAN Number (Tax Compliance)</label>
          <input type="text" name="pan_number" value="{{ profile.pan_number or '' }}" placeholder="ABCDE1234F" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white font-mono uppercase focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Bank Account Number (Fallback)</label>
          <input type="text" name="bank_account_number" value="{{ profile.bank_account_number or '' }}" placeholder="9876543210123" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white font-mono focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Bank IFSC Code</label>
          <input type="text" name="bank_ifsc" value="{{ profile.bank_ifsc or '' }}" placeholder="HDFC0001234" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white font-mono uppercase focus:outline-none focus:border-emerald-500">
        </div>
      </div>
    </div>

    <!-- 2. Professional Qualifications & Portfolio -->
    <div class="pro-card p-6 space-y-4">
      <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-indigo-500"></span>
        <span>2. Skills & Portfolio Credentials</span>
      </h3>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Core Expertise *</label>
          <select name="expertise" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
            <option value="Website Design & Development" {% if profile.expertise == 'Website Design & Development' %}selected{% endif %}>Website Design & Development</option>
            <option value="SEO & Technical Performance" {% if profile.expertise == 'SEO & Technical Performance' %}selected{% endif %}>SEO & Technical Performance</option>
            <option value="UI/UX Prototyping (Figma)" {% if profile.expertise == 'UI/UX Prototyping (Figma)' %}selected{% endif %}>UI/UX Prototyping (Figma)</option>
            <option value="Full-Stack Engineering" {% if profile.expertise == 'Full-Stack Engineering' %}selected{% endif %}>Full-Stack Engineering</option>
          </select>
        </div>

        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Experience Level</label>
          <input type="text" name="experience" value="{{ profile.experience or '' }}" placeholder="e.g. 4+ Years Senior Designer" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Portfolio or GitHub URL *</label>
          <input type="url" name="portfolio" value="{{ profile.portfolio or '' }}" required placeholder="https://yourportfolio.com or github.com/user" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-zinc-400 font-semibold mb-1.5">Availability Status</label>
          <select name="availability" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
            <option value="Available (Full-Time Sprints)" {% if profile.availability == 'Available (Full-Time Sprints)' %}selected{% endif %}>Available (Full-Time Sprints)</option>
            <option value="Available (Part-Time / Overflow)" {% if profile.availability == 'Available (Part-Time / Overflow)' %}selected{% endif %}>Available (Part-Time / Overflow)</option>
            <option value="Busy with Active Sprints" {% if profile.availability == 'Busy with Active Sprints' %}selected{% endif %}>Busy with Active Sprints</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-zinc-400 font-semibold mb-1.5">Skills / Tech Stack Tags</label>
        <input type="text" name="skills" value="{{ profile.skills or '' }}" placeholder="Figma, Tailwind CSS, Python/Flask, React, Core Web Vitals, Schema Markup" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
      </div>
    </div>

    <button type="submit" class="w-full py-3.5 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-bold text-xs shadow-xl transition cursor-pointer">
      Save Specialist Profile & Payout Credentials →
    </button>
  </form>

  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
